# Builds and tests Blockwise on macOS, Linux and Windows, and keeps each
# build as a downloadable artifact on the run's page.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            exe: Blockwise
          - name: Linux
            os: ubuntu-latest
            exe: Blockwise
          - name: Windows
            os: windows-latest
            exe: Blockwise.exe
    defaults:
      run:
        working-directory: app
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      # egui's window needs these to build on Linux (the file dialog uses the
      # desktop portal, so no GTK)
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Keep the app
        uses: actions/upload-artifact@v4
        with:
          name: Blockwise-${{ matrix.name }}
          path: app/target/release/${{ matrix.exe }}
          if-no-files-found: error
