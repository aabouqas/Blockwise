      <path transform="translate(510 512) rotate(-13.03)" d="M-300,0 H-44 C-26,0 -18,6 -20,22 C-22,34 -48,44 -48,74 A48 48 0 0 0 48,74 C48,44 22,34 20,22 C18,6 26,0 44,0 H300" fill="none" stroke="#000" stroke-width="14"/>
